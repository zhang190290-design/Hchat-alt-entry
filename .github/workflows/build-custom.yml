name: 指定版本构建（不建 Release）

# 用途：按指定版本名/版本号构建签名 APK，只上传 artifact，不创建 tag、不建 Release、不改分支。
# 触发：Actions → 指定版本构建（不建 Release）→ Run workflow。

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 版本名（写入 versionName）
        required: true
        default: '6.6.5'
      version_code:
        description: versionCode（需 >= 手机已装版本才能覆盖安装）
        required: true
        default: '1026'

permissions:
  contents: read

concurrency:
  group: build-custom-${{ github.ref }}-${{ github.event.inputs.version_code }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: always
          validate-wrappers: false

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: 还原签名证书
        env:
          HCAT_KEYSTORE_BASE64: ${{ secrets.HCAT_KEYSTORE_BASE64 }}
        run: |
          set -e
          if [ -z "$HCAT_KEYSTORE_BASE64" ]; then
            echo "缺少 secrets.HCAT_KEYSTORE_BASE64"
            exit 1
          fi
          mkdir -p app/keystore
          printf '%s' "$HCAT_KEYSTORE_BASE64" | base64 -d > app/keystore/release.jks
          ls -l app/keystore/release.jks

      - name: 构建签名 APK
        env:
          HCAT_VERSION_NAME: ${{ github.event.inputs.version_name }}
          HCAT_VERSION_CODE: ${{ github.event.inputs.version_code }}
          HCAT_APK_NAME: Hchat-alt-entry-${{ github.event.inputs.version_name }}-${{ github.event.inputs.version_code }}-signed.apk
          HCAT_STORE_PASSWORD: ${{ secrets.HCAT_STORE_PASSWORD }}
          HCAT_KEY_ALIAS: ${{ secrets.HCAT_KEY_ALIAS }}
          HCAT_KEY_PASSWORD: ${{ secrets.HCAT_KEY_PASSWORD }}
        run: |
          set -uo pipefail
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          echo "版本: ${HCAT_VERSION_NAME} (${HCAT_VERSION_CODE}) 产物: ${HCAT_APK_NAME}"
          ok=0
          for attempt in 1 2 3; do
            echo "===== 第 $attempt 次构建 ====="
            if ./gradlew assembleRelease --no-daemon --stacktrace \
                 -Dorg.gradle.internal.http.connectionTimeout=60000 \
                 -Dorg.gradle.internal.http.socketTimeout=60000; then
              ok=1; break
            fi
            [ "$attempt" -lt 3 ] && sleep 30
          done
          [ "$ok" = "1" ] || { echo "三次构建均失败"; exit 1; }
          ls -l app/build/outputs/apk/release/ dist/ 2>/dev/null || true

      - name: 校验签名与版本
        run: |
          set -e
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          sha256sum "$APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | head -6
          "$BT/aapt2" dump badging "$APK" 2>/dev/null | head -3 || true

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: Hchat-${{ github.event.inputs.version_name }}-${{ github.event.inputs.version_code }}
          path: |
            app/build/outputs/apk/release/*.apk
            dist/*.apk
          if-no-files-found: error
          retention-days: 30
